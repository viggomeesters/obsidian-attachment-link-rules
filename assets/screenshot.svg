<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Attachment Link Rules settings</title><desc id="desc">Settings preview with link and embed extension fields.</desc>
  <rect width="1120" height="620" rx="28" fill="#17181d"/>
  <rect x="50" y="42" width="1020" height="536" rx="20" fill="#202127" stroke="#393b44"/>
  <text x="95" y="105" fill="#f3f4f6" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="700">Extension rules</text>
  <text x="95" y="178" fill="#f3f4f6" font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="600">Link extensions</text>
  <text x="95" y="212" fill="#9ca3af" font-family="Inter,Segoe UI,sans-serif" font-size="18">Drop without an exclamation mark</text>
  <rect x="610" y="150" width="390" height="92" rx="12" fill="#15161a" stroke="#525560"/>
  <text x="635" y="205" fill="#d1d5db" font-family="ui-monospace,Consolas,monospace" font-size="20">pdf docx xlsx pptx zip</text>
  <line x1="95" y1="275" x2="1000" y2="275" stroke="#34363e"/>
  <text x="95" y="337" fill="#f3f4f6" font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="600">Embed extensions</text>
  <text x="95" y="371" fill="#9ca3af" font-family="Inter,Segoe UI,sans-serif" font-size="18">Drop with an exclamation mark</text>
  <rect x="610" y="309" width="390" height="92" rx="12" fill="#15161a" stroke="#7c5cff"/>
  <text x="635" y="364" fill="#d1d5db" font-family="ui-monospace,Consolas,monospace" font-size="20">png jpg webp mp3 mp4</text>
  <line x1="95" y1="435" x2="1000" y2="435" stroke="#34363e"/>
  <text x="95" y="500" fill="#f3f4f6" font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="600">Unlisted extensions</text>
  <text x="610" y="500" fill="#9ca3af" font-family="Inter,Segoe UI,sans-serif" font-size="20">Keep native behavior</text>
</svg>
