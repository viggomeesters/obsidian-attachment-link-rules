<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Attachment Link Rules</title><desc id="desc">PDF links without an exclamation mark and image embeds with one.</desc>
  <rect width="1280" height="640" rx="36" fill="#111318"/>
  <circle cx="1080" cy="105" r="220" fill="#7c5cff" opacity=".16"/>
  <circle cx="170" cy="620" r="250" fill="#38bdf8" opacity=".12"/>
  <text x="96" y="150" fill="#a78bfa" font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="700" letter-spacing="3">OBSIDIAN PLUGIN</text>
  <text x="96" y="245" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="68" font-weight="750">Attachment Link Rules</text>
  <text x="96" y="305" fill="#aeb6c5" font-family="Inter,Segoe UI,sans-serif" font-size="30">Choose link or embed syntax by file extension.</text>
  <rect x="96" y="375" width="470" height="112" rx="20" fill="#1b1f2a" stroke="#343b4d"/>
  <text x="128" y="420" fill="#94a3b8" font-family="ui-monospace,Consolas,monospace" font-size="23">PDF</text>
  <text x="128" y="465" fill="#f8fafc" font-family="ui-monospace,Consolas,monospace" font-size="31">[[report.pdf]]</text>
  <rect x="610" y="375" width="470" height="112" rx="20" fill="#1b1f2a" stroke="#6d5bd0"/>
  <text x="642" y="420" fill="#a78bfa" font-family="ui-monospace,Consolas,monospace" font-size="23">IMAGE</text>
  <text x="642" y="465" fill="#f8fafc" font-family="ui-monospace,Consolas,monospace" font-size="31">![[diagram.png]]</text>
</svg>
